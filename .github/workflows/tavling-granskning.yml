name: Tävlingsgranskning (nattlig djupgranskning)

# NATTLIG DJUPGRANSKNING (Beslut B etapp 3, grindbeslut 2026-08-18): spelar om
# gårdagens GODKÄNDA tävlingsinskick och kontrollerar att varje BOTKORT var
# motorns eget val (deterministiskt ur playSeed — exakt jämförelse). Avvikare
# flyttas till status 'granskning' med skäl; rapporten laddas upp som artefakt
# (ägarens grindbeslut: rapport i nattvakten, inget eget UI).
#
# RÖD körning = enbart haveri (nät/DB/motorfel) → GitHub mejlar ägaren.
# Fynd gör ALDRIG körningen röd — de är rapport, inte larm.
#
# Hemligheter (Settings → Secrets → Actions): DAILY_SEED_SECRET (finns sedan
# förscreeningen) + SUPABASE_URL + SUPABASE_SERVICE_ROLE_KEY (ägarsteg vid
# etapp 3-deployen). Ingen produktionspåverkan utöver statusflytten.
#
# VERSIONSMEDVETEN (2026-09-20): ett inskick som avviker mot dagens motor prövas
# om mot de motorversioner som varit live (inskickets stämpel först) i egna
# git-arbetsträd — därför fetch-depth 0. Bara om INGEN version lade korten
# flyttas inskicket. Manuell körning (Actions → Run workflow) kan ange datum och
# "ompröva flyttade": då återställs inskick som en tidigare granskning flyttat
# på fel grund (spelmotor-deploy mitt på tävlingsdagen).

on:
  schedule:
    # 01:30 UTC = 03:30 svensk sommartid / 02:30 vintertid — tävlingsdagen är
    # stängd (dygnsskiftet Europe/Stockholm) och alla inskick är inne.
    - cron: '30 1 * * *'
  workflow_dispatch:
    inputs:
      datum:
        description: 'Tävlingsdag att granska (YYYY-MM-DD). Tomt = igår.'
        required: false
        default: ''
      omprova_flyttade:
        description: 'Ompröva + återställ inskick som en tidigare nattgranskning flyttat'
        type: boolean
        required: false
        default: false

concurrency:
  group: tavling-granskning
  cancel-in-progress: false

jobs:
  granskning:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          # Omprovet checkar ut äldre motorversioner → hela historiken behövs.
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Installera beroenden
        run: npm ci

      - name: Granska gårdagens inskick
        env:
          DAILY_SEED_SECRET: ${{ secrets.DAILY_SEED_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Indata via miljön (aldrig inklistrat i skriptet) + formkontroll nedan.
          INDATA_DATUM: ${{ inputs.datum }}
          OMPROVA_FLYTTADE: ${{ inputs.omprova_flyttade && '1' || '' }}
        run: |
          DAG="$INDATA_DATUM"
          if [ -z "$DAG" ]; then DAG=$(TZ=Europe/Stockholm date -d 'yesterday' +%F); fi
          if ! echo "$DAG" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "Ogiltigt datum: $DAG"; exit 1
          fi
          echo "Granskar $DAG (Europe/Stockholm) · ompröva flyttade: ${OMPROVA_FLYTTADE:-nej}"
          GRANSKA_TAVLING=$DAG \
            npx vitest run src/lib/engine/tavlingsgranskning.probe.test.ts

      # Påbyggnad 3 (2026-09-13): den SLUTLIGA ställningen för avslutade dagar →
      # daily_standings (historiken + medaljtabellen). Körs EFTER granskningen
      # (statusflyttar ska inte räknas) och även om den fick fynd (if: always()).
      # Idempotent: fyller saknade dagar + skriver om de tre senaste.
      - name: Avsluta gårdagens tävling (slutlig ställning → daily_standings)
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Manuell omprövning av en äldre dag → skriv om just den dagens ställning.
          OMSKRIV_DATUM: ${{ inputs.datum }}
        run: AVSLUTA_TAVLING=1 npx vitest run src/lib/engine/tavlingsavslut.probe.test.ts

      - name: Ladda upp rapporten (även vid rött)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tavlingsgranskning-rapporter
          path: |
            revisor-output/tavlingsgranskning-*
            revisor-output/tavlingsavslut-*
          retention-days: 30
