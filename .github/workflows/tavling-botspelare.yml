name: Tävlingsbot (nattligt botspel)

# BOT-DELTAGAREN I DAGLIGA TÄVLINGEN (ägarbeslut 2026-08-31): "rebidz-bot"
# spelar dagens 12 givar strax efter att de genererats och skickar in resultaten
# i daily_results — samma validering och radform som människors inskick
# (src/lib/engine/tavlingsbot.probe.test.ts). Med 1–3 mänskliga spelare
# garanterar boten minst två resultat per giv, så matchpoängen betyder något
# varje dag.
#
# Tider: Vercel-cronen genererar givarna 23:05 UTC (00:05/01:05 svensk tid —
# ny tävlingsdag). Boten spelar 23:45 UTC (00:45/01:45 svensk tid) — dagens
# datum i Europe/Stockholm är då alltid den NYA tävlingsdagen, året runt.
#
# Idempotent: allt är deterministiskt ur (hemlighet, datum, bricka) och redan
# inskickade brickor hoppas över — en extra körning (workflow_dispatch) är
# ofarlig.
#
# RÖD körning = haveri (nät/DB/motorfel/ingen tävling genererad) → GitHub
# mejlar ägaren. Fynd (avvisade botinskick = motorbuggar) gör ALDRIG körningen
# röd — de är rapport, inte larm.
#
# Hemligheter (Settings → Secrets → Actions): DAILY_SEED_SECRET +
# SUPABASE_URL + SUPABASE_SERVICE_ROLE_KEY (samma som nattgranskningen).

on:
  schedule:
    - cron: '45 23 * * *'
  workflow_dispatch:

concurrency:
  group: tavling-botspelare
  cancel-in-progress: false

jobs:
  botspel:
    runs-on: ubuntu-latest
    # ~40 s per giv × 12 givar + marginal (delade CI-kärnor är långsammare).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Installera beroenden
        run: npm ci

      - name: Spela dagens tävling som bot
        env:
          DAILY_SEED_SECRET: ${{ secrets.DAILY_SEED_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          IDAG=$(TZ=Europe/Stockholm date +%F)
          echo "Boten spelar $IDAG (Europe/Stockholm)"
          BOT_TAVLING=$IDAG \
            npx vitest run src/lib/engine/tavlingsbot.probe.test.ts

      - name: Ladda upp rapporten (även vid rött)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tavlingsbot-rapporter
          path: revisor-output/tavlingsbot-*
          retention-days: 30
